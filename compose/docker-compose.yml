name: hw1

services:
  # Reverse proxy: принимает запросы на порту 80 и передаёт их в app
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app_network

  # Приложение: nginx со страницей Hello World, наружу порт не открыт
  app:
    image: nginx:alpine
    volumes:
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    name: hw1_app_network
